   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52675c" transform="translate(43.2 404.746312)">Одни 251 МО, цели сентября–декабря 2024; 8 моделей раскрыты в таблице. Ревизии и параметры фиксированы.</text>
